spring.application.name=product-service
server.port=8082

# MySQL connection on correct port (3307)
spring.datasource.url=jdbc:mysql://mysql:3307/biznify_product_service
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Eureka and service discovery in Kubernetes
# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Partner service URL using internal service name
partner.service.base-url=http://partner-service/api

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
