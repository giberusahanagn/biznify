spring.application.name=warehouse-service
server.port=8083

# Correct DB config for K8s
spring.datasource.url=jdbc:mysql://mysql:3307/biznify_warehouse_service
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Internal service URLs
partner.service.base-url=http://partner-service
product.service.base-url=http://product-service
product.batch.service.base-url=http://product-batch-service


