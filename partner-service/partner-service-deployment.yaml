apiVersion: apps/v1
kind: Deployment
metadata:
  name: partner-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: partner-service
  template:
    metadata:
      labels:
        app: partner-service
    spec:
      containers:
        - name: partner-service
          image: sahanagn3005/partner-service:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SPRING_CONFIG_NAME
              value: application
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3307/biznify_partner_service
            - name: SPRING_DATASOURCE_USERNAME
              value: root
            - name: SPRING_DATASOURCE_PASSWORD
              value: root
            - name: SPRING_ACTIVEMQ_BROKER_URL
              value: tcp://activemq:61616
            - name: SPRING_ACTIVEMQ_USER
              value: admin
            - name: SPRING_ACTIVEMQ_PASSWORD
              value: admin
            - name: SPRING_MAIL_USERNAME
              value: sunilofficial781@gmail.com
            - name: SPRING_MAIL_PASSWORD
              value: ayyo zgwf qbga veto
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka:8761/eureka/
