version: '3.8'

services:
  mysql:
    image: mysql:8
    container_name: mysql-biznify
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"  # Host:Container
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - biznify-network

networks:
  biznify-network:
